<!-- Jarol Welcome Hero & Mascot Card -->
<div class="flex flex-col items-center text-center mt-2">
<!-- Friendly Character Framing -->
<div class="relative w-44 h-44 mb-3 flex items-center justify-center">
<div class="absolute inset-0 bg-surface-variant/40 rounded-full scale-95 blur-md transform"></div>
<img alt="Jarol, el cangrejo maestro sonriente con guayabera y sombrero" class="relative w-40 h-40 object-contain rounded-2xl drop-shadow-[0_6px_14px_rgba(10,29,44,0.08)] transform transition-transform duration-300 hover:scale-105 active:scale-95 cursor-pointer" id="jarol-avatar" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB0jJAR48R5VzAnBCv_JZyqEmcX-6nPgIy4hYHhrHYLQ5_r5tdfmPgTNvbpykxrJSEbc-9EhdDa9oBl4apI8bGyFjKoVXLANlCuxrElkYSDBin1F_K_ACEZCNKWzbVFxmnVkOYL8RiZ6DTdG-MAcHVwOnU4_WcUAzihWZqy8XWgGZ6UOVTyH-zx95VX67jRu1lfsJG1VNwIP274FfrLnwbEBZa8uY9-VjgnO_F2mFDBtr7Q4owgN5w"/>
<!-- Playful Mexican greeting micro-pill badge -->
<span class="absolute -top-1 right-2 inline-flex items-center px-2.5 py-1 rounded-full bg-secondary-container text-on-secondary-container font-label-sm text-label-sm shadow-[0_2px_0_#a43c28]">
        ¡De volada!
      </span>
</div>
<!-- Friendly Text Hierarchy -->
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight leading-tight">
      ¡Quiúbole! Soy Jarol
    </h1>
<h2 class="font-headline-sm text-headline-sm text-primary-container font-semibold mt-1">
      ¿Qué vamos a aprender hoy?
    </h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1.5 max-w-[280px]">
      Pregúntame lo que quieras sobre tus materias
    </p>
</div>
<!-- Quick Prompts Stack (Zero icons, Clean tactile editorial feel) -->
<div class="flex flex-col gap-2.5 mt-6 w-full" id="suggestions-group">
<!-- Prompt 1 -->
<button class="group w-full text-left px-4 py-3.5 bg-surface-container-lowest text-on-surface rounded-xl shadow-[0_3px_0_#d2e5f9] active:translate-y-0.5 active:shadow-[0_1px_0_#d2e5f9] transition-all flex items-center justify-between" data-prompt="¿Cómo se resuelven las fracciones?" onclick="handleSuggestionClick(this)" type="button">
<span class="font-label-lg text-label-lg font-normal text-on-surface group-hover:text-primary transition-colors">
        ¿Cómo se resuelven las fracciones?
      </span>
</button>
<!-- Prompt 2 -->
<button class="group w-full text-left px-4 py-3.5 bg-surface-container-lowest text-on-surface rounded-xl shadow-[0_3px_0_#d2e5f9] active:translate-y-0.5 active:shadow-[0_1px_0_#d2e5f9] transition-all flex items-center justify-between" data-prompt="Explícame la fotosíntesis" onclick="handleSuggestionClick(this)" type="button">
<span class="font-label-lg text-label-lg font-normal text-on-surface group-hover:text-primary transition-colors">
        Explícame la fotosíntesis
      </span>
</button>
<!-- Prompt 3 -->
<button class="group w-full text-left px-4 py-3.5 bg-surface-container-lowest text-on-surface rounded-xl shadow-[0_3px_0_#d2e5f9] active:translate-y-0.5 active:shadow-[0_1px_0_#d2e5f9] transition-all flex items-center justify-between" data-prompt="¿Qué es una ecuación?" onclick="handleSuggestionClick(this)" type="button">
<span class="font-label-lg text-label-lg font-normal text-on-surface group-hover:text-primary transition-colors">
        ¿Qué es una ecuación?
      </span>
</button>
<!-- Prompt 4 -->
<button class="group w-full text-left px-4 py-3.5 bg-surface-container-lowest text-on-surface rounded-xl shadow-[0_3px_0_#d2e5f9] active:translate-y-0.5 active:shadow-[0_1px_0_#d2e5f9] transition-all flex items-center justify-between" data-prompt="Ayúdame con Historia" onclick="handleSuggestionClick(this)" type="button">
<span class="font-label-lg text-label-lg font-normal text-on-surface group-hover:text-primary transition-colors">
        Ayúdame con Historia
      </span>
</button>
</div>
<!-- Subtle conversational cheer -->
<div class="flex items-center justify-center gap-1.5 mt-5 text-on-surface-variant opacity-80">
<span class="w-1.5 h-1.5 rounded-full bg-primary-container"></span>
<span class="font-label-sm text-label-sm">Secundaria y Preparatoria SEP México</span>
<span class="w-1.5 h-1.5 rounded-full bg-primary-container"></span>
</div>
<!-- Bottom Floating Chat Input Area -->
<div class="sticky bottom-3 mt-6 z-30">
<form class="relative flex items-center bg-surface-container-lowest rounded-full p-1.5 pl-4 shadow-[0_8px_20px_rgba(10,29,44,0.06),0_2px_0_#d2e5f9] transition-shadow focus-within:shadow-[0_8px_24px_rgba(18,107,115,0.12),0_2px_0_#126b73]" id="chat-form" onsubmit="handleSend(event)">
<input autocomplete="off" class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none pr-2" id="user-input" placeholder="Pregúntale algo a Jarol…" type="text"/>
<button aria-label="Enviar mensaje" class="flex-shrink-0 w-11 h-11 rounded-full bg-primary-container text-on-primary flex items-center justify-center shadow-[0_3px_0_#005158] active:translate-y-0.5 active:shadow-[0_1px_0_#005158] transition-all focus:outline-none" id="send-button" type="submit">
<span class="material-symbols-outlined text-[20px] transition-transform duration-200 group-hover:scale-110">arrow_upward</span>
</button>
</form>
</div>
</div>
<script>
  function handleSuggestionClick(btn) {
    const text = btn.getAttribute('data-prompt');
    const input = document.getElementById('user-input');
    if (!input) return;
    input.value = text;
    input.focus();
    
    // Tactile micro-bounce delight on Jarol
    const avatar = document.getElementById('jarol-avatar');
    if (avatar) {
      avatar.classList.add('scale-110', '-rotate-2');
      setTimeout(() => {
        avatar.classList.remove('scale-110', '-rotate-2');
      }, 300);
    }
  }

  function handleSend(e) {
    e.preventDefault();
    const input = document.getElementById('user-input');
    const val = input ? input.value.trim() : '';
    if (!val) return;

    // Trigger slight reaction
    const avatar = document.getElementById('jarol-avatar');
    if (avatar) {
      avatar.classList.add('scale-105');
      setTimeout(() => avatar.classList.remove('scale-105'), 200);
    }
    input.value = '';
    input.placeholder = 'Jarol está escribiendo...';
    setTimeout(() => {
      input.placeholder = 'Pregúntale algo a Jarol…';
    }, 1800);
  }
</script></main></body></html>
