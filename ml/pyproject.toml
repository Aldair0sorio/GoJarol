
[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "gojarol-ml"
version = "0.1.0"
description = "Modulo de Machine Learning y NLP de Go Jarol"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.6,<2.0",
    "pandas>=2.2,<3.0",
    "numpy>=2.1,<3.0",
    "joblib>=1.4,<2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
